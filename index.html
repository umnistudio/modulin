<title>Modulin</title>
<style>
:root{
  --a:#71864B;
  --a2:#8CA15F;
  --pale:#E5EDD5;
  --bg:#F8FAF4;
  --ink:#30362B;
  --muted:#7D8673;
  --border:#E1E8D8;
  --progress-bg:#E8EEDF;
}
*{box-sizing:border-box}
body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  padding:20px 16px 48px;
}
.app{max-width:720px;margin:auto}
@media (min-width: 900px){ .app{max-width:820px} }
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.eyebrow{font-size:12px;letter-spacing:2px;font-weight:800;color:var(--a)}
h1{font-size:20px;margin:5px 0 0;font-weight:700}
.semester{font-size:10px;color:var(--muted);font-weight:700;margin-top:3px}
.menu-btn{width:42px;height:42px;border-radius:14px;background:var(--pale);border:none;display:flex;align-items:center;justify-content:center;padding:0;color:var(--a)}
.menu-btn svg{display:block;width:18px;height:18px}
.card{background:#fff;border:1px solid var(--border);border-radius:18px;padding:16px;margin-bottom:14px;box-shadow:0 5px 18px #71864b0b}

/* hero / focus card */
.focus{background:linear-gradient(145deg,#637A43,#8CA15F);color:#fff;border:0;padding:20px;cursor:pointer}
.focus-top-row{display:flex;justify-content:space-between;align-items:center}
.focus .tag{display:inline-block;font-size:10px;font-weight:800;letter-spacing:.3px;border-radius:99px;padding:7px 14px;background:#ffffff30}
.focus h2{font-size:23px;margin:14px 0 4px;font-weight:800}
.focus .sub{font-size:12px;color:#EEF3E8}
.focus .progress{height:9px;border-radius:99px;background:#ffffff35;overflow:hidden;margin:14px 0}
.focus .bar{height:100%;background:#E4ECD7;border-radius:99px}
.focus .meta{display:flex;justify-content:space-between;align-items:center;font-size:13px}
.focus .meta b{font-weight:800}
.focus .meta span{font-size:12px;color:#EEF3E8}
.focus .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
.focus .stat{background:#ffffff25;border-radius:12px;padding:12px 10px}
.focus .stat b{font-size:22px;display:block;font-weight:800}
.focus .stat small{font-size:9px;letter-spacing:.3px;color:#EEF3E8}

.progress{height:9px;border-radius:99px;background:var(--progress-bg);overflow:hidden}
.bar{height:100%;background:var(--a);border-radius:99px;transition:width .2s}
.subject-header{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
.date-range{font-size:10px;color:var(--muted);margin-bottom:8px}
.name-input{font-size:15px;font-weight:700;border:none;background:transparent;padding:4px 0;flex:1;min-width:0;color:var(--ink)}
.name-input:focus{outline:none;border-bottom:1px solid var(--border)}
.status-pill{font-size:9px;font-weight:800;letter-spacing:.3px;padding:5px 10px;border-radius:99px;white-space:nowrap}
.status-belum{background:var(--progress-bg);color:var(--muted)}
.status-progress{background:var(--pale);color:#5D713B}
.status-selesai{background:var(--a);color:#fff}
.section-label{display:flex;justify-content:space-between;font-size:10px;font-weight:800;letter-spacing:.3px;color:var(--muted);margin:14px 0 7px}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.mod-btn{height:34px;font-size:11px;font-weight:700;border-radius:9px;border:1px solid var(--border);background:var(--bg);color:var(--muted)}
.mod-btn.on{background:var(--a);color:#fff;border-color:var(--a)}

/* target harian */
.target-section{margin-top:14px;padding-top:12px;border-top:1px solid var(--border)}
.target-row{display:flex;justify-content:space-between;align-items:center}
.target-ring-group{display:flex;align-items:center;gap:12px}
.target-ring{flex-shrink:0}
.target-left h3{font-size:10px;margin:0;letter-spacing:.3px;color:var(--muted);font-weight:800}
.streak{display:flex;align-items:center;gap:4px;font-size:11px;font-weight:800;color:var(--a);background:var(--pale);padding:5px 10px;border-radius:99px;flex-shrink:0}
.target-note{font-size:10px;color:var(--muted);margin-top:4px}

/* kalender mini */
.cal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.cal-head h3{font-size:12px;margin:0;letter-spacing:.3px;color:var(--muted);font-weight:800}
.cal-head span{font-size:11px;color:var(--muted)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal-dow{text-align:center;font-size:8px;color:var(--muted);font-weight:700;padding-bottom:2px}
.cal-day{aspect-ratio:1;border-radius:8px;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--muted)}
.cal-day.blank{border:0;background:transparent}
.cal-day.partial{background:var(--pale);color:#5D713B;border-color:var(--pale);font-weight:700}
.cal-day.hit{background:var(--a2);color:#fff;border-color:var(--a2);font-weight:800}
.cal-day.bonus{background:var(--a);color:#fff;border-color:var(--a);font-weight:800}
.cal-day.friday{background:#FBE4E4;color:#B45454;border-color:#F3C9C9}
.cal-day.today{border-color:var(--a);font-weight:800;color:var(--ink)}
.side-cal-head{margin:20px 0 10px}
.side-cal-head h3{font-size:12px;letter-spacing:.3px;color:var(--muted);margin:0;font-weight:800}
.side-cal-head span{display:block;font-size:10px;color:var(--muted);margin-top:6px}

/* kalender akademik */
.academic-list{display:flex;flex-direction:column;gap:10px}
.academic-row{display:flex;align-items:flex-start;gap:9px}
.academic-dot{width:9px;height:9px;border-radius:50%;margin-top:3px;flex-shrink:0}
.dot-studi{background:#E8C84A}
.dot-tenang{background:#9B8FC4}
.dot-ujian{background:#D98E52}
.academic-text b{display:block;font-size:11px;font-weight:700;color:var(--ink)}
.academic-text span{display:block;font-size:10px;color:var(--muted);margin-top:1px}

/* jadwal fokus */
.schedule-card{padding:14px 16px}
.schedule-top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 12px}
.schedule-card.mode-focus{background:var(--quote,#EEF3E6);border-color:var(--border)}
.schedule-card.mode-upcoming{background:#F5F6F1}
.schedule-card.mode-holiday{background:var(--pale);border-color:var(--border)}
.schedule-icon{font-size:20px;flex-shrink:0}
.schedule-text{flex:1;min-width:0}
.schedule-text b{display:block;font-size:12px;margin-bottom:2px}
.schedule-text span{font-size:11px;color:var(--muted)}
.checkin-btn{border:1px solid var(--a);background:#fff;color:var(--a);font-size:10px;font-weight:800;border-radius:99px;padding:7px 12px;white-space:nowrap;flex-shrink:0}
.checkin-btn.done{background:var(--a);color:#fff;border-color:var(--a)}

/* streak fokus */

/* sesi fokus / timer */
.timer-row{display:flex;flex-wrap:wrap;align-items:center;gap:10px 12px;margin-top:12px;padding-top:12px;border-top:1px solid var(--border)}
.timer-row h3{font-size:10px;margin:0 0 4px;letter-spacing:.3px;color:var(--muted);font-weight:800}
.timer-left{flex:1;min-width:0}
.timer-durations{display:flex;gap:5px}
.dur-chip{padding:4px 9px;border:1px solid var(--border);border-radius:99px;font-size:10px;font-weight:700;color:var(--muted);background:#fff}
.dur-chip.active{background:var(--a);color:#fff;border-color:var(--a)}
.timer-display{font-size:20px;font-weight:800;letter-spacing:.5px;flex-shrink:0}
.timer-btn{border:0;border-radius:99px;padding:9px 14px;font-weight:800;font-size:10px;white-space:nowrap;flex-shrink:0}
.timer-btn.start{background:var(--a);color:#fff}
.timer-btn.stop{background:#EFE1E1;color:#B45454}

/* mode fokus (distraction-free) */
.exit-focus{display:none;position:fixed;top:14px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;font-size:11px;font-weight:700;padding:8px 16px;border-radius:99px;z-index:80;border:0}
body.focus-mode .exit-focus{display:block}
body.focus-mode .hide-in-focus{display:none !important}

/* peringatan streak */
.warn-card{padding:14px 16px;display:flex;align-items:center;gap:12px;background:#FBF3E4;border-color:#F0DFB8}
.warn-card b{display:block;font-size:12px;margin-bottom:2px;color:#7A5B12}
.warn-card span{font-size:11px;color:#8A6E2E}

/* progres mingguan */
.side-week-stat{font-size:11px;color:var(--muted);font-weight:700;margin-top:14px}

/* mode ringan */
.mood-card{padding:16px}
.mood-card h3{font-size:12px;margin:0 0 10px;letter-spacing:.3px;color:var(--muted);font-weight:800}
.mood-btn{width:100%;border:1px solid var(--border);border-radius:12px;padding:11px;background:var(--bg);color:var(--a);font-weight:700;font-size:11px}
.mood-msg{font-size:12px;color:var(--ink);margin-top:10px;line-height:1.5;background:var(--pale);border-radius:10px;padding:10px 12px;display:none}
.mood-msg.show{display:block}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;font-size:12px;font-weight:600;padding:11px 18px;border-radius:99px;opacity:0;pointer-events:none;transition:opacity .25s, transform .25s;z-index:60;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* notifikasi malam (pojok kanan bawah) */
.night-notif{position:fixed;right:16px;bottom:20px;max-width:270px;background:#fff;border:1px solid var(--border);border-radius:14px;padding:14px 14px 14px 16px;box-shadow:0 10px 30px rgba(0,0,0,.14);display:flex;gap:10px;align-items:flex-start;z-index:70}
.night-notif .schedule-icon{font-size:18px}
.night-notif .close-btn{margin-left:4px;background:none;border:none;color:var(--muted);font-size:13px;cursor:pointer;padding:2px;line-height:1;flex-shrink:0}

/* sidebar */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:opacity .2s;z-index:40}
.overlay.open{opacity:1;pointer-events:auto}
.sidebar{position:fixed;top:0;left:0;bottom:0;width:250px;background:#fff;z-index:50;transform:translateX(-100%);transition:transform .25s;padding:20px 16px;overflow-y:auto}
.sidebar.open{transform:translateX(0)}
.sidebar h3{font-size:12px;letter-spacing:.3px;color:var(--muted);margin:0 0 14px}
.side-item{display:block;width:100%;text-align:left;border:1px solid var(--border);border-radius:12px;padding:10px 12px;margin-bottom:8px;background:#fff}
.side-item.active{border-color:var(--a);background:var(--pale)}
.side-item .row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.side-item .name{font-size:12px;font-weight:700;border:none;background:transparent;padding:0;color:var(--ink);min-width:0;flex:1}
.side-item .name:focus{outline:none}
.side-item .pct{font-size:10px;color:var(--muted);font-weight:700}
.side-item .mini-bar{height:5px;border-radius:99px;background:var(--progress-bg);overflow:hidden;margin-top:7px}
.side-item .mini-fill{height:100%;background:var(--a)}

/* koreksi tanggal */
.day-editor{position:fixed;top:50%;left:50%;transform:translate(-50%,-45%);width:270px;background:#fff;border-radius:18px;padding:20px;z-index:90;opacity:0;pointer-events:none;transition:opacity .2s, transform .2s}
.day-editor.open{opacity:1;pointer-events:auto;transform:translate(-50%,-50%)}
.day-editor h3{font-size:12px;letter-spacing:.3px;color:var(--muted);margin:0 0 4px;font-weight:800}
.day-editor-date{font-size:15px;font-weight:700;color:var(--ink);margin-bottom:14px}
.field{display:grid;gap:5px;margin-bottom:16px}
.field label{font-size:9px;font-weight:800;letter-spacing:.3px;color:var(--muted)}
.field input{width:100%;border:1px solid var(--border);background:var(--bg);border-radius:10px;padding:10px;font:600 14px inherit;color:var(--ink)}
.button{width:100%;border:0;border-radius:12px;padding:12px;background:var(--a);color:#fff;font-weight:800;font-size:12px;margin-bottom:8px}
.cancel-btn{width:100%;border:0;background:none;color:var(--muted);font-size:12px;font-weight:700;padding:6px}
.cal-day{cursor:pointer}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div>
      <div class="eyebrow">MODULIN</div>
      <div class="semester" id="semester-label">Semester 4</div>
    </div>
    <button class="menu-btn hide-in-focus" onclick="toggleSidebar(true)" aria-label="Buka daftar mata kuliah">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/></svg>
    </button>
  </div>

  <button class="exit-focus" onclick="exitFocusMode()">✕ Keluar Mode Fokus</button>

  <div id="schedule"></div>
  <div id="hero"></div>
  <div id="subject-card"></div>
  <div id="streakwarn" class="hide-in-focus"></div>
  <div id="mood" class="hide-in-focus"></div>
</div>

<div id="toast" class="toast"></div>
<div id="night-container"></div>

<div class="overlay" id="day-editor-overlay" onclick="closeDayEditor()"></div>
<div class="day-editor" id="day-editor">
  <h3>KOREKSI TANGGAL</h3>
  <div class="day-editor-date" id="day-editor-date"></div>
  <div class="field">
    <label>MODUL SELESAI DI TANGGAL INI</label>
    <input id="day-editor-input" type="number" min="0" max="30">
  </div>
  <button class="button" onclick="saveDayEditor()">💾 Simpan</button>
  <button class="cancel-btn" onclick="closeDayEditor()">Batal</button>
</div>

<div class="overlay" id="overlay" onclick="toggleSidebar(false)"></div>
<div class="sidebar" id="sidebar">
  <h3>PILIH MATA KULIAH</h3>
  <div id="side-list"></div>
  <div id="side-calendar"></div>
  <div id="academic-calendar"></div>
</div>

<script>
const KEY = 'tracker-modul-army-soft';
const DAYS = ['Min','Sen','Sel','Rab','Kam','Jum','Sab'];
const MONTHS = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];

function defaultState(){
  return {
    active: 0,
    target: 2,
    logs: {},
    sitLogs: {},
    nightDismissedDate: null,
    semester: 4,
    semesterAdvanced: false,
    subjects: Array.from({length:5}, (_,i)=>({
      name: 'Mata kuliah ' + (i+1),
      done: Array(30).fill(false),
      beforeStart: null,
      beforeEnd: null,
      afterStart: null,
      afterEnd: null
    }))
  };
}

let state = JSON.parse(localStorage.getItem(KEY) || 'null') || defaultState();
if (typeof state.active !== 'number') state.active = 0;
if (typeof state.target !== 'number') state.target = 2;
if (!state.logs) state.logs = {};
if (!state.sitLogs) state.sitLogs = {};
if (typeof state.nightDismissedDate === 'undefined') state.nightDismissedDate = null;
if (typeof state.semester !== 'number') state.semester = 4;
if (typeof state.semesterAdvanced !== 'boolean') state.semesterAdvanced = false;
state.subjects.forEach(s=>{
  if (typeof s.beforeStart === 'undefined') s.beforeStart = null;
  if (typeof s.beforeEnd === 'undefined') s.beforeEnd = null;
  if (typeof s.afterStart === 'undefined') s.afterStart = null;
  if (typeof s.afterEnd === 'undefined') s.afterEnd = null;
});

function checkSemesterCompletion(){
  const allDone = state.subjects.every(s => s.done.every(Boolean));
  if (allDone && !state.semesterAdvanced){
    state.semester++;
    state.semesterAdvanced = true;
    save();
    showToast('🎓 Semester selesai! Lanjut ke Semester ' + state.semester);
  } else if (!allDone && state.semesterAdvanced){
    state.semester--;
    state.semesterAdvanced = false;
    save();
  }
}

let focusModeOn = false;
let timerSeconds = 0;
let timerRunning = false;
let timerDuration = 25;
let timerHandle = null;

function save(){ localStorage.setItem(KEY, JSON.stringify(state)); }
function isFriday(){ return new Date().getDay() === 5; }
function dateKey(d){
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function todayKey(){ return dateKey(new Date()); }
function todayCount(){ return state.logs[todayKey()] || 0; }
function shortDate(){
  const n = new Date();
  return DAYS[n.getDay()] + ' ' + n.getDate() + ' ' + MONTHS[n.getMonth()];
}

function formatDateKey(key){
  if (!key) return null;
  const [y,m,d] = key.split('-').map(Number);
  return d + ' ' + MONTHS[m-1];
}

function metOn(date){
  if (date.getDay() === 5) return true; // Jumat libur, tidak dihitung gagal
  return (state.logs[dateKey(date)] || 0) >= state.target;
}

function computeStreak(){
  let streak = 0;
  const d = new Date();
  if (metOn(d)){
    streak = 1;
    d.setDate(d.getDate()-1);
  } else {
    d.setDate(d.getDate()-1);
  }
  while (metOn(d)){
    streak++;
    d.setDate(d.getDate()-1);
  }
  return streak;
}

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(window._toastTm);
  window._toastTm = setTimeout(()=>t.classList.remove('show'), 2400);
}

const FOCUS_WINDOWS = [
  { label: 'pagi', start: 5*60+30, end: 6*60+30 },
  { label: 'siang', start: 10*60, end: 11*60+30 },
  { label: 'sore', start: 16*60, end: 17*60+30 }
];
const NIGHT_START = 18*60;
const NIGHT_END = 5*60;

function minutesNow(){
  const n = new Date();
  return n.getHours()*60 + n.getMinutes();
}

function scheduleStatus(){
  const m = minutesNow();
  for (const w of FOCUS_WINDOWS){
    if (m >= w.start && m <= w.end) return { type:'focus', label:w.label };
  }
  if (m >= NIGHT_START || m < NIGHT_END) return { type:'night' };
  return { type:'normal' };
}

function formatDuration(mins){
  mins = Math.max(0, mins);
  const h = Math.floor(mins/60), m = mins%60;
  if (h > 0) return h + ' jam ' + m + ' menit';
  return m + ' menit';
}

function hasCheckedIn(label){
  return (state.sitLogs[todayKey()] || []).includes(label);
}

function checkIn(label){
  const k = todayKey();
  if (!state.sitLogs[k]) state.sitLogs[k] = [];
  if (!state.sitLogs[k].includes(label)) state.sitLogs[k].push(label);
  save();
  render();
  showToast('✅ Check-in tersimpan, kamu duduk fokus sekarang!');
}

function timerRow(){
  const durations = [15,25,45];
  const display = timerRunning || timerSeconds > 0 ? formatTimer(timerSeconds) : formatTimer(timerDuration*60);
  return `<div class="timer-row">
    <div class="timer-left">
      <h3>SESI FOKUS</h3>
      <div class="timer-durations">${durations.map(d=>`<div class="dur-chip ${d===timerDuration?'active':''}" onclick="setTimerDuration(${d})">${d}m</div>`).join('')}</div>
    </div>
    <div class="timer-display" id="timer-display">${display}</div>
    ${timerRunning
      ? `<button class="timer-btn stop" onclick="stopTimer()">⏹ Stop</button>`
      : `<button class="timer-btn start" onclick="startTimer()">▶ Mulai</button>`}
  </div>`;
}

function scheduleCard(){
  if (isFriday()){
    return `<div class="card schedule-card mode-holiday">
      <div class="schedule-top">
        <div class="schedule-icon">🌿</div>
        <div class="schedule-text"><b>Hari ini libur</b><span>Nggak ada jam fokus wajib. Boleh review santai kalau mau.</span></div>
      </div>
    </div>`;
  }

  const st = scheduleStatus();
  const now = minutesNow();

  if (st.type === 'focus'){
    const w = FOCUS_WINDOWS.find(x => x.label === st.label);
    const remaining = w.end - now;
    const checked = hasCheckedIn(st.label);
    return `<div class="card schedule-card mode-focus">
      <div class="schedule-top">
        <div class="schedule-icon">🔆</div>
        <div class="schedule-text"><b>Ini jam fokus ${st.label}mu</b><span>Tersisa ${formatDuration(remaining)} lagi sebelum berakhir.</span></div>
        <button class="checkin-btn ${checked?'done':''}" onclick="checkIn('${st.label}')" ${checked?'disabled':''}>${checked ? '✓ Sudah duduk' : 'Aku duduk sekarang'}</button>
      </div>
      ${timerRow()}
    </div>`;
  }

  let best = null, bestDiff = Infinity;
  FOCUS_WINDOWS.forEach(w=>{
    let diff = w.start - now;
    if (diff <= 0) diff += 24*60;
    if (diff < bestDiff){ bestDiff = diff; best = w; }
  });
  return `<div class="card schedule-card mode-upcoming">
    <div class="schedule-top">
      <div class="schedule-icon">⏱️</div>
      <div class="schedule-text"><b>Jam fokus berikutnya: ${best.label}</b><span>Dalam ${formatDuration(bestDiff)} lagi.</span></div>
    </div>
  </div>`;
}

function focusMetOn(date){
  if (date.getDay() === 5) return true;
  const arr = state.sitLogs[dateKey(date)];
  return !!(arr && arr.length > 0);
}

function computeFocusStreak(){
  let streak = 0;
  const d = new Date();
  if (focusMetOn(d)){ streak = 1; d.setDate(d.getDate()-1); }
  else { d.setDate(d.getDate()-1); }
  while (focusMetOn(d)){ streak++; d.setDate(d.getDate()-1); }
  return streak;
}

function formatTimer(sec){
  const m = Math.floor(sec/60).toString().padStart(2,'0');
  const s = (sec%60).toString().padStart(2,'0');
  return m + ':' + s;
}

function setTimerDuration(mins){
  if (timerRunning) return;
  timerDuration = mins;
  timerSeconds = mins*60;
  render();
}

function startTimer(){
  if (timerRunning) return;
  if (timerSeconds === 0) timerSeconds = timerDuration*60;
  timerRunning = true;
  timerHandle = setInterval(()=>{
    timerSeconds--;
    if (timerSeconds <= 0){
      clearInterval(timerHandle);
      timerRunning = false;
      timerSeconds = 0;
      showToast('🎉 Sesi fokus selesai!');
      const st = scheduleStatus();
      if (st.type === 'focus') checkIn(st.label);
      else render();
    } else {
      renderTimerOnly();
    }
  }, 1000);
  render();
}

function stopTimer(){
  clearInterval(timerHandle);
  timerRunning = false;
  timerSeconds = 0;
  render();
}

function renderTimerOnly(){
  const el = document.getElementById('timer-display');
  if (el) el.textContent = formatTimer(timerSeconds);
}

function enterFocusMode(){
  focusModeOn = true;
  document.body.classList.add('focus-mode');
}

function exitFocusMode(){
  focusModeOn = false;
  document.body.classList.remove('focus-mode');
}

function nightNotif(){
  const st = scheduleStatus();
  if (st.type !== 'night') return '';
  if (state.nightDismissedDate === todayKey()) return '';
  return `<div class="night-notif" id="night-notif">
    <div class="schedule-icon">🌙</div>
    <div class="schedule-text"><b>Waktunya istirahat</b><span>Nggak usah kejar modul baru malam ini. Boleh review santai kalau mau.</span></div>
    <button class="close-btn" onclick="dismissNightNotif()">✕</button>
  </div>`;
}

function dismissNightNotif(){
  state.nightDismissedDate = todayKey();
  save();
  document.getElementById('night-container').innerHTML = '';
}

function weekTotal(){
  let sum = 0;
  const d = new Date();
  for (let i=0;i<7;i++){
    sum += state.logs[dateKey(d)] || 0;
    d.setDate(d.getDate()-1);
  }
  return sum;
}

function streakWarnCard(){
  const m = minutesNow();
  const streak = computeStreak();
  const inWarnWindow = m >= 16*60 && m < NIGHT_START;
  if (!isFriday() && streak > 0 && todayCount() < state.target && inWarnWindow){
    return `<div class="card warn-card">
      <div class="schedule-icon">🔥</div>
      <div class="schedule-text"><b>Sayang kalau streak ${streak} hari kamu putus</b><span>Tinggal ${state.target - todayCount()} modul lagi buat aman hari ini.</span></div>
    </div>`;
  }
  return '';
}

const MOOD_MESSAGES = [
  'Coba baca satu bagian modul dulu aja, gak perlu selesai penuh.',
  'Buka modulnya dulu aja. Itu sudah langkah pertama yang paling berat.',
  'Kerjain 5 menit dulu, kalau capek boleh berhenti kapan aja.',
  'Nggak harus semangat penuh, yang penting mulai dari yang kecil.',
  'Satu modul kecil hari ini tetap lebih baik daripada nol.',
  'Nggak perlu sempurna, cukup satu langkah kecil dulu.'
];

function moodCard(){
  return `<div class="card mood-card">
    <h3>LAGI NGGAK MOOD?</h3>
    <button class="mood-btn" onclick="showMoodMessage()">✨ Kasih aku dorongan kecil</button>
    <div class="mood-msg" id="mood-msg"></div>
  </div>`;
}

function showMoodMessage(){
  const el = document.getElementById('mood-msg');
  const msg = MOOD_MESSAGES[Math.floor(Math.random()*MOOD_MESSAGES.length)];
  el.textContent = msg;
  el.classList.add('show');
}

function statusOf(arr){
  const c = arr.filter(Boolean).length;
  if (c === 0) return {label:'Belum mulai', cls:'status-belum'};
  if (c === arr.length) return {label:'Selesai', cls:'status-selesai'};
  return {label:'Sedang dikerjakan', cls:'status-progress'};
}

function globalPhase(){
  const allBeforeDone = state.subjects.every(s => s.done.slice(0,15).every(Boolean));
  return allBeforeDone ? 'after' : 'before';
}

function phaseSlice(s, phase){
  return phase === 'before' ? s.done.slice(0,15) : s.done.slice(15,30);
}

function toggle(si, mi){
  const wasOn = state.subjects[si].done[mi];
  const willTurnOn = !wasOn;
  state.subjects[si].done[mi] = willTurnOn;

  const s = state.subjects[si];
  const localIdx = mi < 15 ? mi : mi - 15;
  const prefix = mi < 15 ? 'before' : 'after';
  if (localIdx === 0){
    s[prefix + 'Start'] = willTurnOn ? todayKey() : null;
  }
  if (localIdx === 14){
    s[prefix + 'End'] = willTurnOn ? todayKey() : null;
  }

  const before = todayCount();
  const k = todayKey();
  state.logs[k] = Math.max(0, before + (willTurnOn ? 1 : -1));
  const after = state.logs[k];

  if (willTurnOn && si === state.active){
    const phaseNow = globalPhase();
    if (phaseSlice(state.subjects[si], phaseNow).every(Boolean)){
      const n = state.subjects.length;
      for (let step=1; step<=n; step++){
        const idx = (si+step) % n;
        if (!phaseSlice(state.subjects[idx], phaseNow).every(Boolean)){
          state.active = idx;
          break;
        }
      }
    }
  }

  save();
  render();

  if (willTurnOn && before < state.target && after >= state.target){
    showToast('🎉 Target hari ini tercapai!');
  }
}

function renameSubject(si, val){
  state.subjects[si].name = val;
  save();
  renderSidebar();
}

function setActive(si){
  state.active = si;
  save();
  toggleSidebar(false);
  render();
}

function toggleSidebar(open){
  document.getElementById('sidebar').classList.toggle('open', open);
  document.getElementById('overlay').classList.toggle('open', open);
}

let editingDayKey = null;

function openDayEditor(key){
  editingDayKey = key;
  const dt = new Date(key + 'T00:00:00');
  document.getElementById('day-editor-date').textContent = DAYS[dt.getDay()] + ' ' + dt.getDate() + ' ' + MONTHS[dt.getMonth()] + ' ' + dt.getFullYear();
  document.getElementById('day-editor-input').value = state.logs[key] || 0;
  document.getElementById('day-editor').classList.add('open');
  document.getElementById('day-editor-overlay').classList.add('open');
}

function closeDayEditor(){
  editingDayKey = null;
  document.getElementById('day-editor').classList.remove('open');
  document.getElementById('day-editor-overlay').classList.remove('open');
}

function saveDayEditor(){
  if (!editingDayKey) return;
  const val = Math.max(0, Math.min(30, parseInt(document.getElementById('day-editor-input').value) || 0));
  state.logs[editingDayKey] = val;
  save();
  closeDayEditor();
  render();
}

function moduleGrid(si, start, end){
  let html = '<div class="grid">';
  for(let mi=start; mi<end; mi++){
    const on = state.subjects[si].done[mi];
    html += `<button class="mod-btn ${on?'on':''}" onclick="toggle(${si},${mi})">${mi+1}</button>`;
  }
  html += '</div>';
  return html;
}

function heroCard(){
  const phase = globalPhase();
  const phaseLabel = phase === 'before' ? 'Sebelum UTS' : 'Setelah UTS';
  const s = state.subjects[state.active];
  const activeDone = phaseSlice(s, phase).filter(Boolean).length;

  const phaseTotalDone = state.subjects.reduce((a,x)=>a+phaseSlice(x,phase).filter(Boolean).length,0);
  const phaseTotalRemaining = 75 - phaseTotalDone;
  const phasePctAll = Math.round(phaseTotalDone/75*100);
  const phasePct = Math.round(activeDone/15*100);
  const tag = shortDate();
  const focusStreak = computeFocusStreak();

  return `
  <div class="card focus" onclick="enterFocusMode()" title="Ketuk untuk masuk Mode Fokus">
    <div class="focus-top-row">
      <span class="tag">${tag}</span>
      <span class="tag">⏱️ ${focusStreak} hari</span>
    </div>
    <h2>${s.name}</h2>
    <div class="sub">${activeDone === 15 ? phaseLabel + ' sudah selesai untuk matkul ini' : phaseLabel + ' · modul ' + (activeDone+1) + ' dari 15'}</div>
    <div class="progress"><div class="bar" style="width:${phasePct}%"></div></div>
    <div class="meta"><b>${activeDone}/15 selesai</b><span>${15-activeDone} tersisa</span></div>
    <div class="stats">
      <div class="stat"><b>${phaseTotalDone}</b><small>TOTAL SELESAI</small></div>
      <div class="stat"><b>${phaseTotalRemaining}</b><small>TERSISA</small></div>
      <div class="stat"><b>${phasePctAll}%</b><small>PROGRESS</small></div>
    </div>
  </div>`;
}

function targetSection(){
  const c = todayCount();
  const streak = computeStreak();
  const met = c >= state.target;
  const pct = Math.min(100, Math.round(c/state.target*100));
  const fri = isFriday();
  const note = fri ? '🌿 Hari ini libur' : (met ? '🌟 Target tercapai' : (state.target - c) + ' lagi menuju target');
  const circumference = 119.4;
  const offset = circumference * (1 - pct/100);

  return `
  <div class="target-section">
    <div class="target-row">
      <div class="target-ring-group">
        <svg width="46" height="46" viewBox="0 0 46 46" class="target-ring">
          <circle cx="23" cy="23" r="19" fill="none" stroke="var(--progress-bg)" stroke-width="5"/>
          <circle cx="23" cy="23" r="19" fill="none" stroke="var(--a)" stroke-width="5" stroke-linecap="round" stroke-dasharray="${circumference}" stroke-dashoffset="${offset}" transform="rotate(-90 23 23)"/>
          <text x="23" y="27" text-anchor="middle" font-size="13" font-weight="800" fill="var(--ink)">${c}/${state.target}</text>
        </svg>
        <div class="target-left">
          <h3>TARGET HARI INI</h3>
          <div class="target-note">${note}</div>
        </div>
      </div>
      ${streak > 0 ? `<span class="streak">🔥 ${streak} hari</span>` : ''}
    </div>
  </div>`;
}

function subjectCard(si){
  const s = state.subjects[si];
  const phase = globalPhase();
  const arr = phaseSlice(s, phase);
  const doneCount = arr.filter(Boolean).length;
  const st = statusOf(arr);
  const label = phase === 'before' ? 'SEBELUM UTS' : 'SETELAH UTS / SEBELUM UAS';
  const start = phase === 'before' ? 0 : 15;
  const end = phase === 'before' ? 15 : 30;

  const startKey = phase === 'before' ? s.beforeStart : s.afterStart;
  const endKey = phase === 'before' ? s.beforeEnd : s.afterEnd;
  let dateLine = '';
  if (startKey && endKey){
    dateLine = `<div class="date-range">Mulai ${formatDateKey(startKey)} · Selesai ${formatDateKey(endKey)}</div>`;
  } else if (startKey){
    dateLine = `<div class="date-range">Mulai ${formatDateKey(startKey)}</div>`;
  }

  return `
  <div class="card">
    <div class="subject-header">
      <input class="name-input" value="${s.name}" onchange="renameSubject(${si}, this.value)" />
      <span class="status-pill ${st.cls}">${st.label.toUpperCase()}</span>
    </div>
    ${dateLine}
    <div class="section-label"><span>${label}</span><span>${doneCount}/15</span></div>
    ${moduleGrid(si,start,end)}
    ${targetSection()}
  </div>`;
}

function calendarMarkup(){
  const n = new Date(), y = n.getFullYear(), m = n.getMonth();
  const firstDow = new Date(y,m,1).getDay();
  const daysInMonth = new Date(y,m+1,0).getDate();
  const todayStr = todayKey();

  let cells = '';
  for (let i=0;i<firstDow;i++) cells += '<div class="cal-day blank"></div>';
  for (let i=1;i<=daysInMonth;i++){
    const dt = new Date(y,m,i);
    const key = dateKey(dt);
    const count = state.logs[key] || 0;
    const fri = dt.getDay() === 5;
    const isToday = key === todayStr;
    let cls = '';
    if (count === 0) cls = fri ? 'friday' : '';
    else if (count < state.target) cls = 'partial';
    else if (count === state.target) cls = 'hit';
    else cls = 'bonus';
    cells += `<div class="cal-day ${cls} ${isToday?'today':''}" onclick="openDayEditor('${key}')">${i}</div>`;
  }

  return `
    <div class="side-cal-head"><h3>KALENDER PROGRESS</h3><span>${n.toLocaleDateString('id-ID',{month:'long',year:'numeric'})}</span></div>
    <div class="cal-grid">${['M','S','S','R','K','J','S'].map(x=>`<div class="cal-dow">${x}</div>`).join('')}${cells}</div>
    <div class="side-week-stat">${weekTotal()} modul selesai pekan ini</div>`;
}

const ACADEMIC_CALENDAR = [
  { label: 'Periode Studi 1', range: '3 Sep – 20 Des 2026', kind: 'studi' },
  { label: 'Pekan Tenang 1', range: '3 – 7 Nov 2026', kind: 'tenang' },
  { label: 'UTS Normal', range: '8 – 14 Nov 2026', kind: 'ujian' },
  { label: 'UTS Susulan', range: '16 – 20 Des 2026', kind: 'ujian' },
  { label: 'Periode Studi 2', range: '20 Des 2026 – 13 Feb 2027', kind: 'studi' },
  { label: 'Pekan Tenang 2', range: '25 – 31 Jan 2027', kind: 'tenang' },
  { label: 'UAS Normal', range: '1 – 7 Feb 2027', kind: 'ujian' },
  { label: 'UAS Susulan', range: '9 – 13 Feb 2027', kind: 'ujian' }
];

function academicCalendarMarkup(){
  const rows = ACADEMIC_CALENDAR.map(item => `
    <div class="academic-row">
      <span class="academic-dot dot-${item.kind}"></span>
      <div class="academic-text">
        <b>${item.label}</b>
        <span>${item.range}</span>
      </div>
    </div>`).join('');

  return `
    <div class="side-cal-head"><h3>KALENDER AKADEMIK</h3><span>Fall 2026</span></div>
    <div class="academic-list">${rows}</div>`;
}

function renderSidebar(){
  document.getElementById('side-list').innerHTML = state.subjects.map((s,si)=>{
    const pct = Math.round(phaseSlice(s, globalPhase()).filter(Boolean).length/15*100);
    return `
    <div class="side-item ${si===state.active?'active':''}" onclick="setActive(${si})">
      <div class="row">
        <input class="name" value="${s.name}" onclick="event.stopPropagation()" onchange="renameSubject(${si}, this.value)" />
        <span class="pct">${pct}%</span>
      </div>
      <div class="mini-bar"><div class="mini-fill" style="width:${pct}%"></div></div>
    </div>`;
  }).join('');
}

function render(){
  checkSemesterCompletion();
  document.getElementById('semester-label').textContent = 'Semester ' + state.semester;
  renderSidebar();
  document.getElementById('schedule').innerHTML = scheduleCard();
  document.getElementById('hero').innerHTML = heroCard();
  document.getElementById('subject-card').innerHTML = subjectCard(state.active);
  document.getElementById('streakwarn').innerHTML = streakWarnCard();
  document.getElementById('mood').innerHTML = moodCard();
  document.getElementById('side-calendar').innerHTML = calendarMarkup();
  document.getElementById('academic-calendar').innerHTML = academicCalendarMarkup();
  document.getElementById('night-container').innerHTML = nightNotif();
  document.body.classList.toggle('focus-mode', focusModeOn);
}

render();
</script>
</body>
</html>
